<script>
    var form = document.getElementById("my-form");
    
    form.onsubmit = function(event) {
      event.preventDefault(); 
      
      var data = new FormData(form);
      // تحويل البيانات لتنسيق يفهمه السيرفر فوراً
      var object = {};
      data.forEach((value, key) => object[key] = value);
      var json = JSON.stringify(object);

      var xhr = new XMLHttpRequest();
      xhr.open(form.method, form.action);
      xhr.setRequestHeader("Content-Type", "application/json"); // إخبار السيرفر أننا نرسل بيانات منظمة
      xhr.setRequestHeader("Accept", "application/json");
      
      xhr.onreadystatechange = function() {
        if (xhr.readyState !== XMLHttpRequest.DONE) return;
        if (xhr.status === 200) {
          // التوجيه لصفحة الشكر بعد التأكد من استلام السيرفر للبيانات
          window.location.href = "https://alymaanythlkm.github.io/999/thanks.html";
        } else {
          alert("خطأ: تأكد من تفعيل النموذج في إيميلك");
        }
      };
      xhr.send(json);
    };
</script>
